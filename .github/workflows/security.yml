name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.96.0"
          extra_args: --no-verification --results=unverified --fail-on-scan-errors

  backend:
    name: Backend quality and PostgreSQL checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: witscraft-ci
          POSTGRES_PASSWORD: witscraft-ci-password
          POSTGRES_DB: witscraft-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U witscraft-ci -d witscraft-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENVIRONMENT: test
      DATABASE_USERNAME: witscraft-ci
      DATABASE_PASSWORD: witscraft-ci-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: witscraft-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Install backup script shell
        run: sudo apt-get update && sudo apt-get install --yes zsh
        working-directory: .
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --local
      - name: Lint backend
        run: uv run ruff check app tests migrations ../../scripts/create-release-manifest.py ../../scripts/smoke-release.py
      - name: Upgrade empty database to migration head
        run: uv run alembic upgrade head
      - name: Reject model and migration drift
        run: uv run alembic check
      - name: Run complete backend test suite
        run: uv run pytest -q

  frontend:
    name: Node dependency and artifact checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
        working-directory: apps/web
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: apps/web
      - name: Lint frontend
        run: npm run lint
        working-directory: apps/web
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: apps/web
      - name: Build production frontend
        run: npm run build:production
        working-directory: apps/web
      - name: Check browser artifacts
        run: python3 scripts/check-production-artifacts.py
      - name: Verify release manifest generation
        run: python3 scripts/create-release-manifest.py --output "${RUNNER_TEMP}/witscraft-release.json"
