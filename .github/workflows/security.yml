name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          base: ""
          head: ${{ github.sha }}
          version: "3.96.0"
          extra_args: --no-verification --results=unverified --fail-on-scan-errors

  backend:
    name: Python dependency and production checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.4"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-extras
      - name: Audit installed dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --local
      - name: Verify production security boundaries
        run: uv run pytest -q tests/test_security_boundaries.py
        env:
          DATABASE_USERNAME: ci-user
          DATABASE_PASSWORD: ci-password
          DATABASE_NAME: witscraft-ci

  frontend:
    name: Node dependency and artifact checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
        working-directory: apps/web
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: apps/web
      - name: Lint frontend
        run: npm run lint
        working-directory: apps/web
      - name: Type-check frontend
        run: npm run typecheck
        working-directory: apps/web
      - name: Build production frontend
        run: npm run build:production
        working-directory: apps/web
      - name: Check browser artifacts
        run: python3 scripts/check-production-artifacts.py
