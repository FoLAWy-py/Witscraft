name: witscraft-staging

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
    ports:
      - "127.0.0.1:${STAGING_DATABASE_PORT:?STAGING_DATABASE_PORT is required}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    volumes:
      # PostgreSQL 18 stores clusters in major-version-specific subdirectories.
      # Mount the parent so future pg_upgrade operations do not cross a mount boundary.
      - postgres18-cluster-data:/var/lib/postgresql

volumes:
  postgres18-cluster-data:
